<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VENTRA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400..600&family=Playfair+Display:wght@600;800&family=Nunito:wght@700;900&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: persistent sidebar of five modules around one Business DNA; each page opens with the coach line that ties it to the user's business. */
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--surface2:#E9EDF3;--ink:#101828;--muted:#566176;--line:#D6DCE6;
  --accent:#2547D0;--accent-ink:#FFFFFF;--accent-soft:#E3E9FC;--amber:#C27A0A;--amber-soft:#FBEFD6;
  --good:#1F8A4C;--warn:#B7791F;--bad:#C0392B;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1320;--surface:#151D2D;--surface2:#1D2740;--ink:#E8EDF7;--muted:#94A1BA;--line:#27334D;
  --accent:#8AA2FF;--accent-ink:#0D1320;--accent-soft:#1E2A4F;--amber:#F2B24A;--amber-soft:#3A2D14;
  --good:#4CC38A;--warn:#E0A94B;--bad:#F07A6A;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1320;--surface:#151D2D;--surface2:#1D2740;--ink:#E8EDF7;--muted:#94A1BA;--line:#27334D;
  --accent:#8AA2FF;--accent-ink:#0D1320;--accent-soft:#1E2A4F;--amber:#F2B24A;--amber-soft:#3A2D14;
  --good:#4CC38A;--warn:#E0A94B;--bad:#F07A6A;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:700}
h2{font-size:1.35rem;font-weight:650}
h3{font-size:1.05rem;font-weight:650}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto;padding:22px 0 24px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:.04em;text-decoration:none;color:var(--ink)}
.brand i{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:1rem}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group .eyebrow{padding:0 10px 4px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:520}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav .badge{font-size:.7rem;background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:1px 7px;font-weight:650}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.xpbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.main{padding:22px 0 80px;min-width:0}
.topbar{display:none}
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.page-head p{color:var(--muted);max-width:60ch;margin-top:6px}
.coachline{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.coachline .av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.8rem}
.coachline p{flex:1;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card.lift{box-shadow:var(--shadow)}
.card h3{margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.9rem;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:.88rem;font-weight:550}
.chip:hover{background:var(--surface2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tag.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.9rem}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;font-weight:400}
textarea.input{min-height:76px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.q{display:flex;flex-direction:column;gap:8px;padding:16px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble .av{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.75rem;margin-top:1px}
.bubble b{font-family:var(--f-display);font-weight:600;font-size:1.02rem}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--surface2)}
.steps i.on{background:var(--accent)}
.hero{padding:clamp(28px,6vw,64px) 0 28px;display:grid;gap:26px}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800;max-width:16ch}
.hero .lead{font-size:1.15rem;color:var(--muted);max-width:56ch}
.verbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:0;border-top:1px solid var(--line)}
.verbs div{padding:14px 14px 14px 0;border-bottom:1px solid var(--line)}
.verbs b{font-family:var(--f-display);letter-spacing:.06em;color:var(--accent);display:block;font-size:.85rem}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.84rem}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--accent-ink);font-weight:800;font-size:.8rem;margin-top:1px;padding:0}
.chk.on{background:var(--good);border-color:var(--good)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{font-weight:600}
.timeline{display:grid;gap:0}
.tl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.phase{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.phase:first-child{border-top:0}
.phase.cur{background:linear-gradient(90deg,var(--accent-soft),transparent 70%);margin:0 -18px;padding-left:18px;padding-right:18px}
.avatar{flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff}
.post{display:flex;gap:12px}
.post .body{flex:1;min-width:0}
.listing{display:flex;flex-direction:column;gap:8px}
.listing h3{margin:0}
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto;padding:4px 2px}
.msg{max-width:84%;padding:10px 13px;border-radius:12px;background:var(--surface2);align-self:flex-start;white-space:pre-wrap}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.msg .btn{margin-top:6px}
.modal-back{position:fixed;inset:0;background:rgba(8,12,22,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;max-width:90vw}
.logo-box{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;aspect-ratio:5/3;display:grid;place-items:center}
.logo-box svg{width:100%;height:100%;display:block}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:.3em;color:rgba(16,24,40,.14);transform:rotate(-14deg)}
.locked{filter:blur(5px);pointer-events:none;user-select:none}
.swatch{height:56px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:flex-end;padding:6px;font-family:var(--f-mono);font-size:.7rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:5px 0}
.hbar .bar{height:9px}
.scroll-x{overflow-x:auto}
.disc{font-size:.8rem;color:var(--muted);border-left:3px solid var(--amber);padding:2px 0 2px 10px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.ring text{font-family:var(--f-display)}
.demo{font-size:.78rem;background:var(--amber-soft);color:var(--amber);padding:5px 10px;border-radius:8px;display:inline-block}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:var(--shadow);border-radius:99px;padding:11px 18px}
@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);background:var(--bg);z-index:40;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 20px max(16px,env(safe-area-inset-left,0px));transform:translateX(-102%);transition:transform .2s;border-right:1px solid var(--line);height:auto}
  .side.open{transform:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;z-index:20;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
  .split{grid-template-columns:minmax(0,1fr)}
  .tl,.phase{grid-template-columns:minmax(0,1fr);gap:6px}
  .phase.cur{margin:0 -12px;padding-left:12px;padding-right:12px}
  .hbar{grid-template-columns:100px minmax(0,1fr) 40px}
  .kv{grid-template-columns:minmax(0,1fr)}
}
.nextstep{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:8px 12px;background:var(--surface)}.tbl{width:100%;border-collapse:collapse;font-size:.88rem}.tbl th,.tbl td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}.tbl th{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

{id:'l1',cat:'validation',topic:'Market research',title:'How to know if anyone wants your idea',min:6,level:0,stages:['pre'],body:['Before you build, find out whether the problem is real. A problem is real when people already spend time or money trying to solve it.','Talk to ten people who have the problem. Listen for stories, not opinions. Past behaviour tells you more than promises.'],action:'Write down three people you can talk to this week.'},
{id:'l2',cat:'validation',topic:'Customer validation',title:'Ask better questions in customer interviews',min:7,level:0,stages:['pre','early'],body:['Avoid asking "would you buy this?". People say yes to be polite.','Ask: when did you last face this problem, what did you do, and what did it cost you? Those answers show real demand.'],action:'Rewrite your interview questions so none mention your product.'},
{id:'l3',cat:'validation',topic:'Customer validation',title:'Run a 48-hour demand test',min:8,level:1,stages:['pre','early'],body:['Put a simple page or message in front of 20 people with a price and a way to reserve.','Count how many take the next step. A reservation or deposit is stronger than a compliment.'],action:'Decide the number of reservations that would prove demand.'},
{id:'l4',cat:'validation',topic:'Market research',title:'Size up your competitors in an hour',min:6,level:0,stages:['pre','early'],body:['Competitors are proof that people pay. List five and note price, promise and complaints.','Your opening is usually a complaint that none of them fix.'],action:'Write one sentence that says how you are different.'},
{id:'l5',cat:'product',topic:'Product development',title:'Build a minimum viable product',min:8,level:0,stages:['pre'],body:['A first version should do one job well. Cut every feature that does not help a customer buy.','Use what you already own. Spend money only after someone has paid.'],action:'List what you can remove from version one.'},
{id:'l6',cat:'product',topic:'Product development',title:'Turn feedback into your next release',min:6,level:1,stages:['early','operating'],body:['Collect feedback after every sale. Group it into themes and fix the most common one first.','Tell customers what you changed. It builds loyalty.'],action:'Ask your last three customers one question.'},
{id:'l7',cat:'branding',topic:'Branding',title:'What a brand is and what it is not',min:5,level:0,stages:['pre','early'],body:['A brand is the feeling people have when they think of you. A logo is only one part.','Choose three traits, such as bold, friendly and reliable, and use them in everything you write.'],action:'Pick three brand traits in Brand Studio.'},
{id:'l8',cat:'branding',topic:'Branding',title:'Choosing a business name',min:5,level:0,stages:['pre'],body:['Good names are short, easy to say and easy to spell. Say it aloud on the phone to a friend.','Check the domain, social handles and existing businesses before you commit.'],action:'Shortlist three names and test them on five people.'},
{id:'l9',cat:'branding',topic:'Launch',title:'Plan a small launch',min:7,level:1,stages:['pre'],body:['A launch is a date when you invite specific people to buy. Start with people you know.','Set a goal such as 10 sales, then work back day by day.'],action:'Set a launch date and a number goal.'},

{id:'l12',cat:'marketing',topic:'Marketing',title:'Build a simple weekly content rhythm',min:6,level:1,stages:['early','operating'],body:['Post three times a week. One proof post, one lesson post, one offer.','Reuse each idea in several formats.'],action:'Plan next week\'s three posts.'},

/* ===== ROADMAP ===== */
function buildRoadmap(d,prev){
  const set=d.stage==='scaling'?'operating':d.stage;
  const tpl=PHASES[set];
  const start=today(),end=new Date(d.endDate);
  const span=Math.max(12,daysBetween(start,end));
  const len=span/6;
  const phases=tpl.map((p,i)=>{
    const s=Math.round(i*len),e=Math.round((i+1)*len)-1;
    let tasks=p[2].filter(id=>!(id==='ads'&&d.capital<1000));
    if(i===4&&d.capital>=1000&&set!=='operating')tasks=tasks.concat(['ads']);
    let name=len>=27?'Month '+(Math.round(s/30)+1):len>=6?'Week '+(Math.floor(s/7)+1):'Days '+(s+1)+'–'+(e+1);
    return{id:'ph'+i,label:name,name:p[0],goal:p[1],start:iso(addDays(start,s)),end:iso(addDays(start,e)),tasks}});
  return{created:iso(start),phases,stage:d.stage};
}

function roadmapPct(){if(!S.roadmap)return 0;let n=0,k=0;S.roadmap.phases.forEach(p=>{n+=p.tasks.length;k+=p.tasks.filter(taskDone).length});return n?Math.round(k/n*100):0}

  const d=D();if(!S.roadmap)return[];
  const n=d.time==='full'||d.time==='2h'?3:2;

}

function learningPath(){
  const d=D();const sc=healthScores();const lvl={beginner:0,explorer:0,builder:1,founder:1,operator:2,growth:2}[d.experience];const stg=d.stage==='scaling'?'operating':d.stage;
  const items=LESSONS.map(l=>{
    let s=(l.stages.includes(stg)?35:0)+(100-sc[l.cat])*.5-Math.abs(l.level-lvl)*8-(S.lessons[l.id]?200:0);
    if(stg==='pre'&&['Market research','Customer validation'].includes(l.topic))s+=34;else if(stg==='pre'&&['Product development','Branding','Launch'].includes(l.topic))s+=8;
    if(stg!=='pre'&&['Finance','Sales','Operations','Scaling'].includes(l.topic))s+=12;
    const why=!l.stages.includes(stg)?'Useful background':sc[l.cat]<45?'Your '+HEALTH_CATS.find(c=>c[0]===l.cat)[1].toLowerCase()+' is low at '+sc[l.cat]+'%':'Fits your '+STAGE_LABEL[d.stage].toLowerCase()+' stage';
    return{...l,score:s,why}});
  return items.sort((a,b)=>b.score-a.score);
}

/* ===== MARKET ENTRY ===== */
function entryAnalysis(){
  const d=D();const e=S.market.entry;const I=ind(d);
  const m=new Date().getMonth();
  const dist=Math.min(...I.peak.map(p=>((p-m)+12)%12));
  const factors=[];
  const demand=Math.min(100,Math.round(e.interest/20*100));
  factors.push(['Customer demand',demand,e.interest+' of 20 potential customers confirmed interest']);
  factors.push(['Product readiness',+e.ready,'Your own rating of how ready the offer is']);
  const comp=d.competitors.length>3?45:62;
  factors.push(['Competition',comp,'Typical competitors: '+I.comps.map(c=>c[0]).join(', ').toLowerCase()]);
  const seas=dist===0?95:dist<=2?85:dist<=4?60:40;
  factors.push(['Seasonality',seas,dist===0?'You are in a peak month':dist<=2?'A peak starts within about '+dist+' months':'Next typical peak is about '+dist+' months away']);
  const need=d.stage==='pre'?Math.max(300,e.budget||0):0;const bud=Math.min(100,Math.round(d.capital/Math.max(300,e.budget||600)*100));
  factors.push(['Resources',bud,R(d.capital)+' available versus '+R(Math.max(300,e.budget||600))+' for a first launch']);
  factors.push(['Market growth',70,I.trends[0]]);
  const total=Math.round(factors.reduce((a,f)=>a+f[1],0)/factors.length);
  let verdict,tone;
  if(demand<50){verdict=`Your product may be better positioned for launch after validating demand with 20 potential customers. You have ${e.interest} so far.`;tone='warn'}
  else if(+e.ready<60){verdict='Demand looks encouraging. Improve product readiness before a wider launch, and start with a small soft launch.';tone='warn'}
  else{verdict='Evidence supports a small, controlled launch. Keep spend low and measure results weekly.';tone='good'}
  return{factors,total,verdict,tone,dist};
}

function needsOf(){
  const d=D();const sc=healthScores();const n=new Set();
  if(sc.branding<50)n.add('designer');
  if(sc.marketing<45)n.add('marketer');
  if(sc.finance<45)n.add('accountant');
  if(d.goal==='Find investors')n.add('investment');
  if(d.goal==='Find business partners')n.add('partner');
  if(d.goal==='Get customers'||d.goal==='Make your first sale')n.add('customers');
  if(d.model==='Sell products'){n.add('supplier');if(sc.marketing<60)n.add('photographer')}
  if(d.industry==='software'||d.resources.indexOf('Website')<0)n.add('developer');
  if(d.stage!=='pre')n.add('distribution');
  (S.deals||[]).forEach(x=>{const k=({'Looking for a designer':'designer','Looking for a developer':'developer','Looking for a supplier':'supplier','Looking for investment':'investment','Looking for a partner':'partner'})[x.kind];if(k)n.add(k)});
  return[...n];
}
function matchPeople(){
  const d=D();const needs=needsOf();
  return PEOPLE.map(p=>{
    let s=0;const why=[];
    if(p.industry===d.industry){s+=22;why.push('Same industry')}
    else if(p.interests.includes(d.industry)||p.interests.includes('all')){s+=14;why.push('Interested in '+ind(d).label.toLowerCase())}
    const off=p.offers.filter(o=>needs.includes(o));
    if(off.length){s+=34;why.push('Offers '+off.join(', ')+' which you need')}
    const asks=p.needs.filter(n=>n==='customers'&&(d.stage!=='pre'||d.skills.length));
    if(asks.length&&d.hasSales){s+=6}
    if(d.skills.some(k=>p.skills.some(x=>x.toLowerCase().includes(k.toLowerCase())||k.toLowerCase().includes(x.toLowerCase())))){s+=10;why.push('Shared skills')}
    if(d.location&&p.location.toLowerCase().includes(d.location.toLowerCase().split(',')[0].trim())&&d.location.trim()){s+=14;why.push('Same area ('+p.location+')')}
    if(p.stage===d.stage){s+=8;why.push('Same stage')}
    if(d.goal==='Find investors'&&p.offers.includes('investment')){s+=18}
    s+=hashStr(p.id+d.name)%6;
    return{p,score:Math.min(98,s),why:why.slice(0,3)};
  }).sort((a,b)=>b.score-a.score);
}

function shell(inner,route){

  const d=S.dna;
  return`<div class="app"><aside class="side" id="side" aria-label="Main navigation"><a class="brand" href="#home"><i>V</i>VENTRA</a><nav class="nav stack" style="gap:16px">${nav}</nav>

  <main class="main" id="main"><div class="topbar"><a class="brand" href="#home"><i>V</i>VENTRA</a><button class="btn sm" data-act="toggleNav" aria-label="Menu">Menu</button></div>${inner}</main></div>
  ${route!=='coach'?`<button class="btn primary fab" data-act="go" data-arg="coach">Ask Zuri</button>`:''}`;
}
function simpleShell(inner){return`<div style="max-width:920px;margin:0 auto;padding-block:20px 80px"><div class="row between" style="margin-bottom:8px"><a class="brand" href="#"><i>V</i>VENTRA</a><button class="btn sm" data-act="theme">Toggle theme</button></div>${inner}</div>`}
let lastRoute='';
function render(){
  const {route,id}=curRoute();const y=window.scrollY;const mi=$('#mentor-in');const miv=mi?mi.value:'';const ae=document.activeElement;const aid=ae&&ae.id,ss=ae&&ae.selectionStart,se=ae&&ae.selectionEnd;
  let html;
  const V={landing:vLanding,onboard:vOnboard,home:vHome,roadmap:vRoadmap,academy:vAcademy,market:vMarket,brand:vBrand,health:vHealth,network:vNetwork,marketplace:vMarketplace,dealroom:vDealroom,match:vMatch,profile:vProfile,business:vBusiness,coach:vMentor,premium:vPremium,payouts:vPayouts};

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i]}for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}

/* ---- codes ---- */
async function tryCode(raw){
  const c=String(raw||'').trim().toUpperCase();if(c.length<4||c.length>12)return false;
  const h=await sha('ventra:code:'+c);if(!h)return false;
  if(h===H_FREE){await redeemFree();return true}
  if(h===H_OWN){await ownerStart();return true}
  return false;
}
async function redeemFree(){
  if(!DBH||!UID){toast('Access codes need the shared store. Open this page while signed in.');return}
  try{
    const col=DBH.collection('redeem');const snap=await col.get();
    const mine=snap.docs.find(d=>d.exists&&d.data()&&d.data().uid===UID);
    if(mine){activateVip();toast('You already have founder access');return}
    const taken=snap.docs.filter(d=>d.exists&&d.data()&&d.data().uid).length;
    if(taken>=FREE_SLOTS){toast('That code is no longer available.');return}
    for(let i=1;i<=FREE_SLOTS;i++){
      const ref=DBH.doc('redeem/s'+i);
      const a=await ref.acquire({holder:UID,ttlMs:4000});if(!a.acquired)continue;
      const cur=await ref.get();if(cur.exists&&cur.data()&&cur.data().uid)continue;
      await ref.set({uid:UID,at:new Date().toISOString()});
      const v=await ref.get();
      if(v.exists&&v.data().uid===UID){activateVip();toast('Founder access unlocked: every feature, free');return}
    }
    toast('That code is no longer available.');
  }catch(e){toast('Your access level cannot claim a code here. Ask the owner for Contributor access.')}
}

  const owner=USR?await USR.isOwner():false;

async function pinSubmit(){
  const el=$('#pin-in'),err=$('#pin-err');if(!el)return;const v=el.value.trim();
  const say=m=>{if(err)err.textContent=m};
  if(!/^\d{4}$/.test(v)){say('Enter 4 digits.');return}
  const h=await sha('ventra:pin:'+v);
  if(h!==H_PIN){MEM.pinFails++;el.value='';if(MEM.pinFails>=5){MEM.pinFails=0;MEM.lockUntil=Date.now()+60000;closeModal();toast('Locked for 60 seconds');return}say('Incorrect PIN. '+(5-MEM.pinFails)+' attempts left.');return}
  try{
    const ref=DBH.doc('ownerclaim/main');const cur=await ref.get();
    if(cur.exists&&cur.data()&&cur.data().uid&&cur.data().uid!==UID){say('Owner access has already been claimed by another account.');return}

}

function luhn(n){let s=0,d=false;for(let i=n.length-1;i>=0;i--){let x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return n.length>=12&&s%10===0}

function pay(key){
  const g=id=>($('#'+id)||{}).value||'';const err=m=>{const e=$('#co-err');if(e)e.textContent=m};

  if(!g('co-name').trim())return err('Enter the name on the card.');

  const m=exp.match(/^(\d{2})\/(\d{2})$/);if(!m||+m[1]<1||+m[1]>12)return err('Enter the expiry as MM/YY.');

  if(!/^\d{3,4}$/.test(cvc))return err('Enter the 3 or 4 digit CVC.');
  if(!/^\S+@\S+\.\S+$/.test(g('co-email')))return err('Enter a valid billing email.');

function activePrefs(){
  const p={length:'balanced',format:'steps',examples:false,tone:'casual',pacing:'overview',approach:'doing',nick:''};
  MM.filter(m=>m.type==='preference'&&m.active&&m.key).forEach(m=>{if(m.key==='name')p.nick=m.value;else if(m.key==='examples')p.examples=m.value==='yes';else p[m.key]=m.value});
  return p;
}
function similar(a,b){const n=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();a=n(a);b=n(b);return a===b||(a.length>8&&(a.includes(b)||b.includes(a)))}
function addMemory(o){
  if(MM.some(m=>m.type===o.type&&similar(m.text,o.text)))return null;
  const m=Object.assign({id:uid(),active:true,ev:2,source:'chat',created:iso(today()),updated:iso(today()),lastUsed:''},o);
  MM.unshift(m);MM=MM.slice(0,120);return m;
}
function bumpPref(key,value,w,from){
  let item=MM.find(m=>m.type==='preference'&&m.key===key&&m.value===value);
  const before=item?item.active:false;
  if(!item){item={id:uid(),type:'preference',key,value,text:PREF_TEXT[key][value],source:'chat',ev:0,active:false,created:iso(today()),updated:iso(today()),lastUsed:'',from};MM.unshift(item)}
  item.ev=Math.round((item.ev+w)*10)/10;item.updated=iso(today());
  MM.filter(m=>m.type==='preference'&&m.key===key&&m.value!==value).forEach(o=>{o.ev=Math.max(0,o.ev-1);if(o.ev<2&&o.source!=='you')o.active=false});
  if(item.ev>=2&&!MM.some(m=>m!==item&&m.type==='preference'&&m.key===key&&m.active&&m.ev>=item.ev)){item.active=true}
  return !before&&item.active?item:null;
}
function learnFromMessage(text,mid){
  const notes=[],rem=[];
  const strong=STRONG.test(text);
  SIGNALS.forEach(([k,v,re])=>{if(re.test(text)){const it=bumpPref(k,v,strong?2:1,mid);if(it)notes.push(it)}});
  const user=MH.filter(m=>m.r==='u');
  if(user.length>=6&&user.length%6===0){const last=user.slice(-6);const avg=last.reduce((a,m)=>a+m.t.length,0)/6;
    if(avg<35){const it=bumpPref('length','brief',.5,mid);if(it)notes.push(it)}else if(avg>220){const it=bumpPref('length','detailed',.5,mid);if(it)notes.push(it)}}
  let m;
  if((m=text.match(/\bcall me ([A-Za-z][A-Za-z'-]{1,20})\b/i))){MM=MM.filter(x=>!(x.type==='preference'&&x.key==='name'));const it=addMemory({type:'preference',key:'name',value:m[1],text:'Likes to be called '+m[1],ev:3,from:mid});if(it)rem.push(it)}
  if((m=text.match(/\bremember (?:that )?(.{4,140})/i))&&!/^\s*to\b/i.test(m[1])){const it=addMemory({type:'fact',text:cap(m[1].replace(/[.!]+$/,'').trim()),from:mid});if(it)rem.push(it)}
  if((m=text.match(/\bi (?:only )?(?:can only |can )?(?:work|study|have time)(?: on this)? (?:on |in |during )?(?:the )?(evenings?|weekends?|mornings?|nights?|lunch ?breaks?)\b/i))){const it=addMemory({type:'fact',text:'Works on this in the '+m[1].toLowerCase(),from:mid});if(it)rem.push(it)}
  if((m=text.match(/\bi(?:'m| am) (?:a|an) ([a-z][a-z ]{2,28}?)(?:[.,!?]|$| and | who | at | in )/i))&&!/\b(bit|little|beginner|new|lot|fan)\b/i.test(m[1])){const it=addMemory({type:'fact',text:'Describes themself as a '+m[1].trim(),from:mid});if(it)rem.push(it)}
  if((m=text.match(/\bi (?:don'?t|do not) (?:like|want|enjoy) (.{3,60}?)(?:[.,!?]|$| because )/i))){const it=addMemory({type:'preference',key:'dislike',text:'Dislikes '+m[1].trim(),ev:2,from:mid});if(it)rem.push(it)}
  if((m=text.match(/\bmy (?:biggest )?(?:fear|worry|challenge|problem|struggle) is (.{3,100}?)(?:[.!?]|$)/i))){const it=addMemory({type:'challenge',text:cap(m[1].trim()),from:mid});if(it)rem.push(it)}
  if((m=text.match(/\bi(?:'ve| have)? decided to (.{4,100}?)(?:[.!?]|$)/i))){const it=addMemory({type:'decision',text:'Decided to '+m[1].trim(),from:mid});if(it)rem.push(it)}
  return{notes,rem};
}
function memUsedFor(q){
  const words=(q.toLowerCase().match(/[a-z]{4,}/g)||[]);
  return MM.filter(m=>m.active&&m.type!=='preference'&&words.some(w=>m.text.toLowerCase().includes(w)));
}

function composeBuiltin(P,prefs,mem){
  const L=[];const nick=prefs.nick||'';
  L.push((nick&&prefs.tone==='casual'?nick+', ':'')+P.lead);
  if(mem.length)L.push(`You told me: "${mem[0].text}". I have kept that in mind.`);
  let pts=P.points.slice();
  if(prefs.pacing==='one'||prefs.length==='brief')pts=pts.slice(0,prefs.pacing==='one'?1:2);
  if(pts.length){if(prefs.format==='steps')pts.forEach((x,i)=>L.push((i+1)+'. '+x));else L.push(pts.join('. ').replace(/\.\./g,'.')+'.')}
  if(prefs.length==='detailed'||prefs.approach==='explain')if(P.why)L.push(P.why);
  if((prefs.examples||prefs.length==='detailed')&&P.example)L.push('Example: '+P.example);
  return L.join('\n');
}
function identityReply(){return{text:`I am Zuri, an AI mentor built into VENTRA. I am not a person. When you allow it, Claude (an AI model) writes my replies using your VENTRA data and the memories you can see in the Memory tab. Otherwise I use built-in guidance. I can be wrong, so check important decisions, and I never promise results.`,next:'',used:[],route:['coach','Open About and privacy']}}
function forgetCommand(text){
  const m=text.match(/^\s*(?:please\s+)?forget(?: about)?(?: that)?\s+(.{3,100})/i);if(!m)return null;
  const q=m[1].toLowerCase().replace(/[.!]+$/,'');const words=q.match(/[a-z]{3,}/g)||[];
  let best=null,bs=0;MM.forEach(x=>{const t=x.text.toLowerCase();const sc=words.filter(w=>t.includes(w)).length;if(sc>bs){bs=sc;best=x}});
  if(!best||bs===0)return{text:`I could not find a memory that matches that. You can see everything I remember in the Memory tab.`};
  MM=MM.filter(x=>x.id!==best.id);persistMentor('mem');return{text:`Done. I deleted this memory: "${best.text}".`};
}
function whatRemember(){
  const a=MM.filter(m=>m.active);if(!a.length)return{text:`I have not stored anything about you yet. When you tell me things, I will show you what I remember, and you can edit or delete it in the Memory tab.`};
  return{text:`I remember ${a.length} thing${a.length>1?'s':''}:\n`+a.slice(0,8).map(m=>'- '+m.text).join('\n')+(a.length>8?`\n...and ${a.length-8} more.`:'')+`\nYou can change or delete any of these in the Memory tab.`};
}

async function mentorSend(text){
  text=String(text||'').trim();if(!text||MB.busy)return;
  if(await tryCode(text))return;
  const dk=iso(today());if(S.coachUse.date!==dk)S.coachUse={date:dk,n:0};
  const umsg={id:uid(),r:'u',t:text.slice(0,2000),ts:Date.now()};MH.push(umsg);
  if(!isPaid()&&S.coachUse.n>=5){MH.push({id:uid(),r:'m',text:`You have used today's 5 free questions. Premium gives unlimited mentoring, or come back tomorrow.`,ts:Date.now(),src:'builtin',used:[],actions:[{l:'See premium plans',r:'premium'}]});persistMentor();save();render();return}
  S.coachUse.n++;
  let learned={notes:[],rem:[]};
  if(MS.remember)learned=learnFromMessage(text,umsg.id);
  const prefs=activePrefs();const remIds=learned.rem.map(x=>x.id);
  const mk=(o)=>Object.assign({id:uid(),r:'m',ts:Date.now(),used:[],actions:[],rem:remIds,learned:learned.notes.map(n=>n.text)},o);
  /* deterministic privacy/identity commands, never sent to a model */
  let det=null;
  if(/\b(are you (a )?(human|real|person|ai|bot|robot)|who are you|what are you)\b/i.test(text))det=identityReply();
  else if(/\bwhat do you (remember|know) about me|show my memories|my memories\b/i.test(text))det=whatRemember();
  else{const f=forgetCommand(text);if(f)det=f}
  if(det){MH.push(mk({text:det.text,src:'builtin',next:det.next||'',used:det.used||[],actions:det.route?[{l:det.route[1],r:det.route[0]}]:[]}));persistMentor();save();render();return}
  MB.busy=true;render();
  const ctx=ventraContext(text);const memUsed=memUsedFor(text);
  let out=null,src='builtin';
  const ai=await aiReply(text,ctx,prefs);
  if(ai&&ai.cancelled){MB.busy=false;MH.push(mk({text:'Stopped.',src:'builtin'}));persistMentor();save();render();return}
  if(ai&&ai.text){out={text:ai.text,next:ai.next};src='ai';
    if(MS.remember)(ai.remember||[]).forEach(r=>{if(r&&['fact','decision','challenge'].includes(r.type)&&typeof r.text==='string'&&r.text.length>=4&&r.text.length<=140){const it=addMemory({type:r.type,text:r.text.trim(),from:umsg.id});if(it)remIds.push(it.id)}})}
  else{const P=builtinParts(text);out={text:composeBuiltin(P,prefs,memUsed),next:P.next,route:P.route,builtUsed:P.used};
    if(ai&&ai.error)out.note=ai.error==='rate_limited'?'The AI model is rate-limited right now, so this reply uses built-in guidance.':'The AI model could not answer, so this reply uses built-in guidance.'}
  const used=src==='ai'?ctx.map(i=>i.label):out.builtUsed||[];
  const usedAll=used.concat(memUsed.slice(0,2).map(m=>'Memory: '+short(m.text,40)));
  memUsed.forEach(m=>m.lastUsed=iso(today()));
  const actions=[];if(out.route)actions.push({l:out.route[1],r:out.route[0]});
  MH.push(mk({text:out.text,src,next:out.next||'',used:usedAll,actions,note:out.note||''}));
  MB.busy=false;persistMentor();save();render();
}

async function copyPNG(svg){
  try{const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
  const cv=document.createElement('canvas');cv.width=1200;cv.height=720;cv.getContext('2d').drawImage(img,0,0,1200,720);
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);toast('PNG copied')}
  catch(e){toast('PNG copy is not available here. Use the SVG code instead.')}
}

const VENTRA_API = 'http://localhost:5000'; // Replace with your live cloud backend URL when hosting online

async function startVentraCheckout(email, amountInZar = 99) {
  const res = await fetch(`${VENTRA_API}/api/payments/initialize`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, amountInZar }),
  });

  const data = await res.json();
  if (!res.ok) {
    alert(data.message || 'Could not start checkout.');
    return;
  }

  localStorage.setItem('ventra_payment_ref', data.reference);
  window.location.href = data.authorization_url;
}
